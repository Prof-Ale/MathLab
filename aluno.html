<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#001a3a">
<meta name="robots" content="noindex">
<title>Arena MathLab, entrar na sala</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet"></noscript>

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--f-display:'Montserrat','Segoe UI',system-ui,sans-serif;--f-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;--bg:#001a3a;--card:#0a2a57;--sf:#16457f;--tx:#eef3fb;--mu:#b3c3dc;--gold:#f2b01e;--gold2:#f6c453;--bd:#27497f;--ok:#22c55e;--no:#f87171;--cy:#06b6d4}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--f-body)}
h1,h2,header b,.go,.sec,#tb button,.grande{font-family:var(--f-display)}
input.cod,.tn,.cx b{font-family:var(--f-mono)}
html{font-size:calc(17px * var(--f,1));-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;border-bottom:2px solid var(--gold);background:#00224a}
header img{width:36px;height:36px;border-radius:50%;object-fit:cover}
header b{color:var(--gold2);letter-spacing:.02em}
header span{margin-left:auto;font-size:.8rem;color:var(--mu)}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:1rem 1rem 2rem;display:flex;flex-direction:column;gap:1rem}
h1{font-size:1.5rem;line-height:1.2}
h2{font-size:1.2rem;color:var(--gold2)}
p{color:var(--tx)}
.mu{color:var(--mu);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:1.1rem;display:flex;flex-direction:column;gap:.8rem}
label{display:flex;flex-direction:column;gap:.35rem;font-weight:700;font-size:.95rem}
input{font:inherit;font-size:1.25rem;padding:.8rem .9rem;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
input.cod{font-size:2rem;letter-spacing:.3em;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
input:focus{outline:3px solid var(--cy);outline-offset:1px;border-color:var(--cy)}
.go{background:var(--gold);color:#2a1b00;border:0;border-radius:999px;padding:1rem 1.4rem;font-weight:800;font-size:1.1rem;cursor:pointer;min-height:56px}
.go:disabled{opacity:.5}
.sec{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:.8rem 1.2rem;font-weight:700;cursor:pointer;font-size:1rem;min-height:48px}
.erro{border:1px solid var(--no);background:rgba(248,113,113,.12);border-radius:12px;padding:.7rem .9rem;color:#ffd0d0}
.banner{position:sticky;top:0;z-index:5;background:var(--gold);color:#2a1b00;font-weight:800;text-align:center;padding:.5rem;font-size:.9rem}
.topo{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:.9rem;color:var(--mu)}
.topo b{color:var(--tx)}
.tempo{height:12px;border-radius:99px;background:var(--card);border:1px solid var(--bd);overflow:hidden}
.tempo i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left;transition:transform .2s linear}
.tempo.urg i{background:var(--no)}
.tn{font-weight:900;font-size:1.3rem;font-variant-numeric:tabular-nums;color:var(--tx)}
.enun{font-size:1.2rem;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.fig{border:1px dashed var(--gold);border-radius:12px;padding:.5rem .8rem;color:var(--gold2);font-size:.9rem}
.ops{display:grid;gap:.7rem}
.op{display:flex;align-items:center;gap:.9rem;text-align:left;width:100%;min-height:68px;padding:.7rem .9rem;border-radius:16px;border:2px solid var(--bd);border-left:10px solid var(--c);background:var(--card);color:var(--tx);font:inherit;font-size:1.1rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
.op:active:not(:disabled){transform:scale(.98)}
.op .l{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--c);color:#061a38;display:grid;place-items:center;font-weight:900;font-size:1.2rem}
.op .s{flex:none;color:var(--c);font-size:1.1rem}
.op .t{overflow-wrap:anywhere;flex:1}
.op:disabled{opacity:.55;cursor:default}
.op.minha{opacity:1;border-color:var(--c);box-shadow:0 0 0 3px var(--c) inset}
.op.certa{opacity:1;border-color:var(--ok);background:rgba(34,197,94,.16)}
.op.errada.minha{opacity:1;border-color:var(--no);background:rgba(248,113,113,.14)}
.grande{font-size:2.4rem;font-weight:900;text-align:center;line-height:1.1}
.ok{color:var(--ok)}.no{color:var(--no)}
.cx{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.cx div{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:.7rem;text-align:center}
.cx b{display:block;font-size:1.5rem;color:var(--gold2)}
.cx small{color:var(--mu)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pulso{width:14px;height:14px;border-radius:50%;background:var(--gold);display:inline-block;animation:pl 1.2s infinite ease-in-out}
@keyframes pl{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pulso{animation:none}.tempo i{transition:none}.op:active{transform:none}}

#tb{display:flex;gap:.4rem;flex-wrap:wrap;padding:.5rem 1rem;background:#00224a;border-bottom:1px solid var(--bd)}
#tb button{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:.45rem .8rem;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;min-height:40px}
#tb button[aria-pressed=true]{background:var(--gold);color:#2a1b00;border-color:var(--gold)}
#tb button:disabled{opacity:.4}
.confirma{min-height:60px;width:100%}
body.contraste{--bg:#000;--card:#111;--sf:#111;--tx:#ff0;--mu:#fff;--gold:#ff0;--gold2:#ff0;--bd:#fff;--ok:#0f0;--no:#ff9d9d;--cy:#0ff}
body.contraste header,body.contraste #tb{background:#000}
body.contraste .go,body.contraste #tb button[aria-pressed=true]{color:#000}
body.contraste .op .l{color:#000}
body.calmo .tempo.urg i{background:var(--gold)}
body.calmo #tn{display:none}
body.calmo .pulso{animation:none}
body.calmo .tempo i{transition:none}
.nota{border:1px solid var(--gold);border-radius:12px;padding:.6rem .8rem;background:rgba(242,176,30,.12);font-size:.92rem}
footer{padding:.8rem 1rem;text-align:center;font-size:.75rem;color:var(--mu)}
</style>
</head>
<body>
<header><img src="assets/logo-circular.webp" alt="" width="36" height="36"><b>Arena MathLab</b><span id="hSala"></span></header>
<nav id="tb" aria-label="Ajustes de acessibilidade">
<button type="button" id="bMenos" aria-label="Diminuir a letra">A−</button>
<button type="button" id="bMais" aria-label="Aumentar a letra">A+</button>
<button type="button" id="bCont" aria-pressed="false">Alto contraste</button>
<button type="button" id="bOuvir">Ouvir</button>
<button type="button" id="bCalmo" aria-pressed="false">Modo calmo</button>
<button type="button" id="bConf" aria-pressed="false">Confirmar antes de enviar</button>
</nav>
<div id="banner" role="status"></div>
<main id="app"><div class="card"><h1>Carregando</h1><p class="mu">Só um instante.</p></div></main>
<div id="anuncio" class="sr" role="status" aria-live="polite"></div>
<footer>© 2026 Prof. Alessandro Barbosa dos Santos (Prof. Alê Chocolate). Sem dados pessoais, só apelido.</footer>
<script src="arena-config.js"></script>
<script src="arena-live.js"></script>
<script src="aluno.js"></script>
</body>
</html>
