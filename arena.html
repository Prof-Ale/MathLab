<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#04122b">
<title>Arena MathLab | Prof. Alê Chocolate</title>
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--fs:1rem;--cy:#06b6d4;--pk:#ec4899;--gr:#10b981;--rd:#ef4444}
body{--bg:#061a38;--card:#0d2c58;--nav:#04122b;--tx:#eef3fb;--mu:#b3c3dc;--gold:#f2b01e;--gold2:#f6c453;--bd:#27497f;--cv:#041225;--sf2:#143b73;--glow:rgba(242,176,30,.22);--sh:0 10px 30px rgba(0,0,0,.35);
--ax1:#38bdf8;--ax2:#a78bfa;--ax3:#2dd4bf;--ax4:#fb923c;--ax5:#f472b6;--axfg:#061a38;--ok:#22c55e;--okbg:rgba(34,197,94,.16)}
body.theme-light{--bg:#f3f6fb;--card:#ffffff;--nav:#0b2a52;--tx:#0b2347;--mu:#4a5c7a;--gold:#e09000;--gold2:#8a5a00;--bd:#ccd7ea;--cv:#f8fafc;--sf2:#eef3fb;--glow:rgba(224,144,0,.18);--sh:0 8px 24px rgba(11,35,71,.12);
--ax1:#0369a1;--ax2:#6d28d9;--ax3:#0f766e;--ax4:#c2410c;--ax5:#be185d;--axfg:#fff;--ok:#15803d;--okbg:rgba(21,128,61,.12)}
body.theme-contrast{--bg:#000;--card:#111;--nav:#1a1a1a;--tx:#ff0;--mu:#fff;--gold:#ff0;--gold2:#ff0;--bd:#fff;--cv:#000;--sf2:#111;--glow:transparent;--sh:none;--cy:#0ff;--gr:#0f0;
--ax1:#ff0;--ax2:#ff0;--ax3:#ff0;--ax4:#ff0;--ax5:#ff0;--axfg:#000;--ok:#0f0;--okbg:#021}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
html{font-size:var(--fs)}
body{background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;line-height:1.45}
button,select,input{font:inherit}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#071d40,var(--nav));border-bottom:2px solid var(--gold);padding:.55rem 1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;color:#eef3fb}
body.theme-light header,body.theme-contrast header{background:var(--nav)}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:var(--gold2)}
.brand img{height:40px;width:40px;border-radius:50%;display:block;object-fit:cover}
.brand span{font-weight:800;letter-spacing:.02em;color:#f6c453}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.btn{background:rgba(255,255,255,.1);color:inherit;border:1px solid var(--bd);padding:.4rem .8rem;border-radius:999px;cursor:pointer;font-weight:700;font-size:.85rem;text-decoration:none;display:inline-flex;align-items:center;gap:.35rem}
.btn:hover,.btn[aria-pressed=true]{background:var(--gold);color:#2a1b00;border-color:var(--gold)}
main{flex:1;width:100%;max-width:1320px;margin:0 auto;padding:1.2rem 1rem 2rem}
footer{background:var(--nav);border-top:2px solid var(--gold);padding:1rem;margin-top:1.5rem;color:#eef3fb;font-size:.8rem}
.ft{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:.8rem}
.ar-hero{margin-bottom:1.2rem;padding:1.3rem;border-radius:18px;background:linear-gradient(135deg,var(--sf2),var(--card));border:1px solid var(--bd);position:relative;overflow:hidden}
.ar-hero:before{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;background:radial-gradient(circle,var(--glow),transparent 65%);pointer-events:none}
.ar-hero h1,.ar-box h1{font-size:clamp(1.5rem,4vw,2.1rem);margin-bottom:.3rem}
.ar-hero p{color:var(--mu);max-width:42rem}
.ar-box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:1.2rem;display:flex;flex-direction:column;gap:.9rem;margin-bottom:1.1rem;box-shadow:var(--sh)}
.ar-box h2{font-size:1.2rem;color:var(--gold2)}
.ar-box h3{font-size:1.05rem}
.ar-dica{color:var(--mu);font-size:.88rem}
.ar-lin{display:flex;gap:.6rem;align-items:flex-end;flex-wrap:wrap}
.ar-fld{display:flex;flex-direction:column;gap:.3rem;font-weight:700;font-size:.88rem}
.ar-inl{flex-direction:row;align-items:center}
input[type=text],select{padding:.55rem .75rem;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.ar-btn{background:var(--sf2);color:var(--tx);border:1px solid var(--bd);padding:.6rem 1rem;border-radius:999px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}
.ar-btn.sec{background:transparent}.ar-btn.peq{padding:.35rem .8rem;font-size:.85rem}
.ar-btn:hover{border-color:var(--gold)}
.ar-go{background:var(--gold);color:#2a1b00;border:0;padding:.8rem 1.6rem;border-radius:999px;font-weight:800;cursor:pointer;font-size:1.05rem;box-shadow:0 6px 18px rgba(242,176,30,.28)}
body.theme-contrast .ar-go{color:#000}
.ar-go:disabled{opacity:.45;cursor:default}.ar-go.peq{padding:.5rem 1.1rem;font-size:.95rem}
.ar-parts{list-style:none;display:flex;gap:.6rem;flex-wrap:wrap}
.ar-parts li{display:flex;align-items:center;gap:.5rem;border:2px solid var(--pc);border-radius:999px;padding:.3rem .5rem .3rem .8rem;background:var(--bg)}
.ar-parts .sim{color:var(--pc)}
.ar-x{background:none;border:0;color:var(--tx);cursor:pointer;font-size:1.3rem;line-height:1;padding:0 .3rem}
.ar-cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;align-items:end}
.ar-chk{display:flex;gap:.6rem;align-items:flex-start;grid-column:1/-1;font-size:.9rem;color:var(--mu)}
.ar-chk input{margin-top:.25rem;width:1.1rem;height:1.1rem}
.ar-eixo{border:1px solid var(--bd);border-left:6px solid var(--ax);border-radius:14px;padding:.7rem .9rem;display:flex;flex-direction:column;gap:.6rem}
.ar-eixo legend{padding:0 .5rem;font-weight:800;color:var(--tx)}
.ar-mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.4rem}
.ar-mod{display:flex;align-items:center;gap:.5rem;padding:.4rem .5rem;border-radius:10px;border:1px solid transparent;cursor:pointer;font-size:.9rem}
.ar-mod:hover{border-color:var(--ax)}
.ar-mod small{color:var(--mu)}
.ar-inicio{display:flex;justify-content:center;margin:.4rem 0 1.4rem}
.ar-tbw{overflow-x:auto}
.ar-tb{width:100%;border-collapse:collapse;font-size:.95rem}
.ar-tb th,.ar-tb td{padding:.6rem;border-bottom:1px solid var(--bd);text-align:left}
.ar-tb th{color:var(--gold2);background:var(--bg)}
/* rodada */
.ar-rodada{background:var(--card);border:1px solid var(--bd);border-top:6px solid var(--ax);border-radius:18px;padding:1.2rem;display:flex;flex-direction:column;gap:1rem;box-shadow:var(--sh)}
.ar-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem}
.ar-info{display:flex;gap:.5rem;flex-wrap:wrap}
.ar-pill{border:1px solid var(--bd);border-radius:999px;padding:.3rem .9rem;background:var(--bg);font-size:.95rem}
.ar-pill.eixo{border-color:var(--ax)}
.ar-timer{position:relative;width:68px;height:68px;flex:none}
.ar-timer svg{width:68px;height:68px;transform:rotate(-90deg)}
.ar-timer circle{fill:none;stroke-width:6}
.ar-timer .tr{stroke:var(--bd)}.ar-timer .tp{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ar-timer span{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:1.5rem}
.ar-timer.urg .tp{stroke:var(--rd)}.ar-timer.urg span{color:var(--rd)}
body.theme-contrast .ar-timer.urg .tp{stroke:#f0f}body.theme-contrast .ar-timer.urg span{color:#f0f}
.ar-grid{display:grid;grid-template-columns:1fr;gap:1.2rem}
.ar-grid.com-fig{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:start}
@media(max-width:920px){.ar-grid.com-fig{grid-template-columns:1fr}.ar-fig{order:2}}
canvas#arCv{width:100%;height:260px;display:block;background:var(--cv);border:2px solid var(--bd);border-radius:14px}
.ar-enun{font-size:clamp(1.3rem,2.6vw,2.2rem);font-weight:800;line-height:1.35;margin-bottom:1rem;outline:none}
.ar-ops{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media(max-width:620px){.ar-ops{grid-template-columns:1fr}}
.ar-op{display:flex;align-items:center;gap:.8rem;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:14px;padding:.9rem 1rem;font-size:clamp(1.05rem,1.8vw,1.6rem);font-weight:700;min-height:4rem;position:relative}
button.ar-op{cursor:pointer}button.ar-op:hover:not(:disabled){border-color:var(--gold)}
.ar-l{width:2.4rem;height:2.4rem;border-radius:10px;display:grid;place-items:center;font-weight:900;color:var(--axfg);flex:none}
.ar-op:nth-child(1) .ar-l{background:var(--ax5)}.ar-op:nth-child(2) .ar-l{background:var(--ax1)}.ar-op:nth-child(3) .ar-l{background:var(--ax4)}.ar-op:nth-child(4) .ar-l{background:var(--ax3)}
.ar-op.certa{border-color:var(--ok);background:var(--okbg)}
.ar-op.errada{opacity:.62}
.ar-sel{margin-left:auto;font-size:.8rem;font-weight:800;color:var(--ok);white-space:nowrap}
.ar-votos h3{margin-bottom:.5rem}
.ar-vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.7rem}
.ar-voto{border:2px solid var(--pc);border-radius:14px;padding:.7rem;background:var(--bg);display:flex;flex-direction:column;gap:.5rem}
.ar-vh{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline;flex-wrap:wrap}
.ar-vh small,.ar-vs{color:var(--mu)}
.ar-vh b span{color:var(--pc)}
.ar-vb{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem}
.ar-vb button{padding:.6rem 0;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:900;cursor:pointer;font-size:1.05rem}
.ar-vb button[aria-pressed=true]{background:var(--gold);color:#2a1b00;border-color:var(--gold)}
body.theme-contrast .ar-vb button[aria-pressed=true]{color:#000}
.ar-vb button:disabled{cursor:default}
.ar-vs.ok{color:var(--ok);font-weight:800}.ar-vs.no{font-weight:700}
.ar-acoes{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem;border-top:1px solid var(--bd);padding-top:.8rem}
.ar-status{color:var(--mu)}
.ar-res{border:1px solid var(--ok);background:var(--okbg);border-radius:14px;padding:1rem;display:flex;flex-direction:column;gap:.5rem}
.ar-res h3{outline:none}
.okt{color:var(--ok);font-weight:700}.not{color:var(--mu);font-weight:700}
.ar-mini{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.ar-ch{border:1px solid var(--pc);border-radius:999px;padding:.2rem .75rem;background:var(--bg);font-size:.9rem}
.ar-podio{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:.5rem 0}
.ar-pc{background:var(--bg);border:2px solid var(--pc);border-radius:16px;padding:1.1rem;text-align:center}
.ar-pc.pos1{box-shadow:0 0 0 3px var(--gold)}
.ar-m{font-size:2rem;font-weight:900;color:var(--gold2)}
.ar-pc h3{margin:.2rem 0}.ar-pts{font-size:1.5rem;font-weight:900;color:var(--gold2)}
.ar-lst{padding-left:1.3rem;line-height:1.8}
.ar-rev{padding:.8rem;border:1px solid var(--bd);border-radius:12px;background:var(--bg);display:flex;flex-direction:column;gap:.3rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{header,footer,.no-print{display:none!important}
 body,main,.ar-box{background:#fff!important;color:#000!important;border:0!important;box-shadow:none!important}
 .ar-box h1,.ar-box h2,.ar-tb th,.ar-m,.ar-pts{color:#0b2a52!important}.ar-tb th,.ar-tb td{border-bottom:1px solid #999!important;color:#000!important;background:#fff!important}
 .ar-pc,.ar-rev{background:#fff!important;border:1px solid #666!important;color:#000!important}.okt{color:#064!important}.ar-dica{color:#333!important}}
</style>
</head>
<body>
<header>
  <a class="brand" href="index.html" aria-label="Voltar ao MathLab"><img src="assets/logo-circular.webp" alt="MathLab" width="40" height="40"><span>Arena</span></a>
  <div class="tools" role="toolbar" aria-label="Ajustes da Arena">
    <button class="btn" type="button" onclick="ArenaHdr.fonte(1)" aria-label="Aumentar fonte">A+</button>
    <button class="btn" type="button" onclick="ArenaHdr.fonte(-1)" aria-label="Diminuir fonte">A-</button>
    <button class="btn" type="button" data-tema="light" aria-pressed="false" onclick="ArenaHdr.tema('light')">Claro</button>
    <button class="btn" type="button" data-tema="dark" aria-pressed="false" onclick="ArenaHdr.tema('dark')">Escuro</button>
    <button class="btn" type="button" data-tema="contrast" aria-pressed="false" onclick="ArenaHdr.tema('contrast')">Alto contraste</button>
    <button class="btn" type="button" id="btnSom" aria-pressed="true" onclick="ArenaHdr.som()">Som ligado</button>
    <a class="btn" href="index.html">Voltar ao MathLab</a>
  </div>
</header>
<main id="arMain"><section class="ar-box"><h2>Carregando os assuntos do MathLab</h2><p>Só um instante.</p></section></main>
<div id="arAnuncio" class="sr-only" role="status" aria-live="polite"></div>
<iframe id="mlFonte" src="index.html" style="display:none" title="Fonte dos geradores do MathLab" tabindex="-1" aria-hidden="true"></iframe>

<script src="arena.js"></script>
<script src="arena-config.js"></script>
<script src="arena-qr.js"></script>
<script src="arena-live.js"></script>
<script src="arena-host.js"></script>
<script src="arena-relatorio.js"></script>
<script src="arena-painel.js"></script>
</body>
</html>
